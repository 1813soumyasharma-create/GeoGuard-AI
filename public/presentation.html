    let currentSlide = 0;

    function renderCurrentSlide() {
      const slide = slides[currentSlide];
      const body = document.getElementById("slide-body");
      body.innerHTML = slide.render();
      document.getElementById("slide-indicator").innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
      
      const card = document.getElementById("slide-card");
      card.classList.remove("slide-enter");
      void card.offsetWidth; // trigger reflow
      card.classList.add("slide-enter");
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderCurrentSlide();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Arrow Navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      }
    });

    // Initialize first slide
    renderCurrentSlide();
  </script>
